steps:
  - name: gcr.io/cloud-builders/docker
    args:
      [
        build,
        -t,
        "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/app:$BUILD_ID",
        .,
      ]
images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/app:$BUILD_ID"
substitutions:
  _REGION: us-central1
  _REPOSITORY: soe-reader
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1200s
